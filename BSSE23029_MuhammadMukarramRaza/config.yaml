# =====================================================================
# config.yaml  --  SINGLE SOURCE OF TRUTH
# =====================================================================
#
# EXAM-DAY WORKFLOW:
#   1. Edit values HERE to match the exam's theme / task.
#   2. Run `python app.py` — no code changes needed.
#   3. To rename mandated function names → edit exam_adapter.py only.
#
# CONFIG RULES:
#   • enabled: true/false  →  section-level ON/OFF switch
#     - sentiment off  → LLM scores text instead of lexicon
#     - scale off      → LLM names the emotional state
#     - categories off → LLM classifies category
#     - responses off  → LLM responds to everything
#     - scoring off    → LLM estimates risk score
#   • If ALL five are off → pure LLM pipeline, nothing deterministic runs
#   • replay.log       → paste the exam's STUDENT_LOG here, zero code change
#   • active_persona   → one line to re-theme the whole assistant
#
# ACCESS IN CODE:
#   from core.conf import get
#   get("llm.model")        → "llama3"
#   get("scale.tiers")      → list of tiers
#   get("scoring.tier_weights.CRISIS") → 15
# =====================================================================


# ─────────────────────────────────────────────────────────────────────
# 1. EXAM META  ──  fills the report banner. Edit on exam day.
# ─────────────────────────────────────────────────────────────────────
exam_meta:
  student_id: "BSSE23029"               # shown in the report banner
  student_name: "Muhammad Mukarram Raza"
  course: "SE305T  Human Computer Interaction"
  exam_date: "2026-06-XX"               # update on exam day


# ─────────────────────────────────────────────────────────────────────
# 2. LLM  ──  local llama3 via Ollama.
#    BEFORE RUNNING: open a separate terminal → `ollama serve` → leave open.
# ─────────────────────────────────────────────────────────────────────
llm:
  base_url: "http://localhost:11434/v1"  # Ollama OpenAI-compatible endpoint
  api_key: "ollama"                       # dummy; Ollama ignores it; client requires it
  model: "llama3"                         # must match an `ollama pull`-ed model name
  temperature: 0.4                        # 0 = deterministic · 1 = creative
  max_tokens: 512                         # cap on reply length
  timeout_seconds: 60                     # give up if Ollama hangs

  # These are the injectable slots any persona can use:
  # Slot	Source	Example value
  # {num_faces}	LIVE.vision	1
  # {mood}	LIVE.vision	"happy"
  # {gesture}	LIVE.vision	"Peace"
  # {head_zone}	LIVE.vision	"Forward"
  # {blinks}	LIVE.vision	5
  # {tier}	LIVE.session last wb	"STRESSED"
  # {category}	LIVE.session last support	"ACADEMIC"
  # {turn}	LIVE.session	3
  # {vision_context}	bridge.vision_context_string	"A person is visible and appears happy..."

  active_persona: "default"    # swap to any key below on exam day — everything follows

  # ── PERSONA DISABLE MAP ───────────────────────────────────────────
  # use_persona(name) in exam_adapter reads this to turn off the right
  # pipeline sections automatically.  true = disable that section.
  persona_disable_map:
    default:          {}
    tutor:            {}
    support:          {}
    advisor:          {}
    ner_extractor:    {sentiment: true, scale: true, categories: true, scoring: true}
    text_classifier:  {categories: true}
    intent_detector:  {categories: true}
    translator:       {sentiment: true, scale: true, categories: true, scoring: true}
    qa_engine:        {sentiment: true, scale: true, categories: true}
    generator:        {sentiment: true, scale: true, categories: true, responses: true, scoring: true}

  # ── VISION CONTEXT TEMPLATES ─────────────────────────────────────
  # Personas that contain {vision_context} have this string injected at
  # call time from LIVE.vision.  When the camera is off or stale, the
  # empty string is used instead so no noise reaches the LLM.
  vision_context_template: "Webcam: {num_faces} face(s) visible. Mood: {mood}. Gesture: {gesture}. Head: {head_zone}. Blinks: {blinks}."
  vision_context_empty: ""     # injected when camera is off or frame is stale

  # ── PERSONAS ─────────────────────────────────────────────────────
  # Each persona is a FULL SYSTEM PROMPT:
  #   [SYSTEM CONTEXT] → sets role + optional live vision data
  #   TASK             → what the model must do
  #   OUTPUT           → exact format required
  #   RULES            → constraints, edge cases, prohibitions
  #
  # {vision_context} is filled automatically by persona_system() in llm.py.
  # Leave it out of a persona to never inject vision data for that task.
  #
  # DISABLE MAP — what pipeline sections to turn off per persona:
  #   default / tutor / support / advisor → keep everything ON
  #   text_classifier / intent_detector   → categories.enabled: false
  #   ner_extractor                       → categories.enabled: false
  #                                          sentiment.enabled: false
  #                                          scale.enabled: false
  #   translator                          → sentiment.enabled: false
  #                                          scale.enabled: false
  #                                          categories.enabled: false
  #                                          scoring.enabled: false
  #   qa_engine                           → sentiment.enabled: false
  #                                          scale.enabled: false
  #                                          categories.enabled: false
  #   generator                           → ALL deterministic stages: false
  #                                          (sentiment, scale, categories,
  #                                           responses, scoring)
  personas:

    # ── CONVERSATIONAL (default) ────────────────────────────────────
    default: |
      [SYSTEM CONTEXT]
      You are a concise, empathetic university wellbeing assistant.
      {vision_context}

      Reply in 1–3 supportive, natural sentences.
      Do not repeat what the user said back to them.
      Do not ask more than one question per reply.

    tutor: |
      [SYSTEM CONTEXT]
      You are a patient academic tutor.
      {vision_context}

      Explain clearly, use examples, and encourage the student.
      Keep replies focused: one concept at a time.

    support: |
      [SYSTEM CONTEXT]
      You are a calm, professional customer-service agent.
      {vision_context}

      Be polite, solution-focused, and concise.
      Acknowledge the issue before offering a solution.

    advisor: |
      [SYSTEM CONTEXT]
      You are a career advisor helping students plan their next steps.
      {vision_context}

      Be practical and specific. Suggest concrete actions.
      Avoid vague encouragement — give real next steps.

    # ── NAMED ENTITY RECOGNITION ────────────────────────────────────
    # Disable: categories.enabled: false
    #          sentiment.enabled: false
    #          scale.enabled: false
    #          scoring.enabled: false
    ner_extractor: |
      [SYSTEM CONTEXT]
      You are a Named Entity Recognition engine.
      {vision_context}

      TASK: Extract all named entities from the user's text.

      OUTPUT: Return ONLY a valid JSON object with exactly these keys:
        "person"   — list of person names        ([] if none)
        "location" — list of place/location names ([] if none)
        "date"     — list of date expressions     ([] if none)
        "time"     — list of time expressions     ([] if none)

      RULES:
      - Output the JSON object only. No introduction, no explanation, no markdown.
      - If a category has no entities, use an empty list [].
      - Normalise dates to YYYY-MM-DD where possible; keep original form otherwise.
      - Do NOT invent entities that are not explicitly in the text.

    # ── TEXT CLASSIFICATION ─────────────────────────────────────────
    # Disable: categories.enabled: false
    # The classify/multilabel prompts select the label;
    # this persona sets the engine's role and constraints.
    text_classifier: |
      [SYSTEM CONTEXT]
      You are a precision text classification engine.
      {vision_context}

      TASK: Assign the user's message to exactly one category from the list provided.

      OUTPUT: The category label only — one word or short phrase, no punctuation around it.

      RULES:
      - Choose the label that best captures the PRIMARY subject.
      - If multiple categories apply, pick the most dominant one.
      - Never explain your choice. Never add anything outside the label.

    # ── INTENT DETECTION ────────────────────────────────────────────
    # Disable: categories.enabled: false
    # Intent = the user's GOAL or desired ACTION, not just the topic.
    # "My laptop broke" topic=TECHNICAL, intent=request_help.
    intent_detector: |
      [SYSTEM CONTEXT]
      You are an intent detection system.
      {vision_context}

      TASK: Identify the PRIMARY intent — the user's core goal or desired action —
      from the message below.

      OUTPUT: One intent label from the provided list. Nothing else.

      RULES:
      - Focus on what the user wants to DO or ACHIEVE, not what they mention.
      - If the user is venting (no clear request), label it: express_distress.
      - Never explain. Never add context. One label only.

    # ── MACHINE TRANSLATION ─────────────────────────────────────────
    # Disable: sentiment.enabled: false
    #          scale.enabled: false
    #          categories.enabled: false
    #          scoring.enabled: false
    # Use translate prompt: build_prompt("translate", source_lang="English",
    #                                    target_lang="Spanish", text="...")
    translator: |
      [SYSTEM CONTEXT]
      You are a professional bilingual translator.
      {vision_context}

      TASK: Translate the user's text between the specified languages.

      OUTPUT: The translated text only. No original, no explanation, no label.

      RULES:
      - Preserve the original meaning, tone, and register exactly.
      - Adapt idioms to natural equivalents in the target language.
      - Formal source → formal translation. Casual source → casual translation.
      - Do not add, remove, or summarise any content.

    # ── QUESTION ANSWERING ──────────────────────────────────────────
    # Disable: sentiment.enabled: false
    #          scale.enabled: false
    #          categories.enabled: false
    # Use qa prompt: build_prompt("qa", context="...", text="<question>")
    qa_engine: |
      [SYSTEM CONTEXT]
      You are a closed-book question-answering system.
      {vision_context}

      TASK: Answer the user's question using ONLY the provided context.

      RULES:
      - If the answer is in the context: quote the key part, then give a direct answer.
      - If the answer is NOT in the context: reply exactly —
          "Not found in the provided context."
      - No speculation. No outside knowledge. No apologies. No padding.
      - Be direct: answer first, brief explanation if necessary.

    # ── TEXT GENERATION / NLG / SURFACE REALISATION ─────────────────
    # Disable ALL deterministic stages:
    #   sentiment.enabled: false   scale.enabled: false
    #   categories.enabled: false  responses.enabled: false
    #   scoring.enabled: false
    # Surface Realisation = choosing the exact words, grammar, and tone
    # to express a given meaning — the final step in dialogue systems.
    generator: |
      [SYSTEM CONTEXT]
      You are a fluent natural language generation engine.
      {vision_context}

      TASK: Complete, continue, or generate the text as instructed by the user.

      RULES:
      - Match the tone, register, and style of the input exactly.
      - Be natural and fluent — avoid robotic or formulaic phrasing.
      - Do not add unsolicited commentary, disclaimers, or meta-text.
      - Output only the generated content.

  context_window: 0   # 0 = send full history every turn
                      # N = send only last N turns (use ~6 for sessions > 15 turns)
  offline_fallback: true   # true  = Ollama unreachable → silently use rule/default
                           # false = raise immediately (catch setup problems early)
  use_json_format: false   # true = ask Ollama for JSON mode (llama3 support varies)

  # Named prompt templates.  {slots} filled by build_prompt(name, **vars).
  # Only change the WORDING — keep {slots} intact.
  # Format-sensitive (ONLY / exactly): classify, multilabel, score, extract.
  # Format-free (rewrite freely):      respond, summarize.
  prompts:
    classify:   "Classify the message into exactly ONE of these labels: {labels}.\nReply with ONLY the label, nothing else.\nMessage: {text}\nLabel:"
    multilabel: "From these labels: {labels}, list ALL that apply.\nReply with ONLY a comma-separated list of labels, nothing else.\nMessage: {text}\nLabels:"
    score:      "Rate the {criterion} of this message on a scale from {lo} to {hi}.\nReply with ONLY a number, nothing else.\nMessage: {text}\nNumber:"
    extract:    "Extract these fields and reply with ONLY a valid JSON object using exactly these keys: {fields}.\nMessage: {text}\nJSON:"
    # respond: persona owns the full system context (role + task + format + constraints).
    # This template is now a thin passthrough — just the user's text.
    # {tier} and {category} are REMOVED: they were injected even when those features
    # were disabled, adding noise ("tier: UNKNOWN, category: GENERAL") to the prompt.
    # The persona sets all the framing; respond just delivers the message.
    respond:    "{text}"
    summarize:  "Summarize the conversation below in about {max_words} words for {audience}.\nConversation:\n{conversation}\nSummary:"


# ─────────────────────────────────────────────────────────────────────
# 3. WHISPER  ──  speech-to-text
#    Model sizes (accuracy vs speed):  tiny < base < small < medium
#    ONLY models you pre-downloaded at home will work offline.
#    Pre-download:  python -c "import whisper; whisper.load_model('base')"
# ─────────────────────────────────────────────────────────────────────
whisper:
  model_size: "base"   # "base" is guaranteed by the install list
                       # "small" only if you cached it: whisper.load_model('small')
  language: null       # null = auto-detect.  "en" forces English (faster).
  fp16: false          # false on CPU / Mac (prevents a FP16 warning)


# ─────────────────────────────────────────────────────────────────────
# 4. AUDIO  ──  microphone capture defaults
# ─────────────────────────────────────────────────────────────────────
audio:
  sample_rate: 16000   # Hz — Whisper requires 16000
  seconds: 7           # default recording length; exam question may override the arg
  channels: 1          # 1 = mono (always use mono for Whisper)


# ─────────────────────────────────────────────────────────────────────
# 5. VOICE  ──  input pipeline behaviour
# ─────────────────────────────────────────────────────────────────────
voice:
  recognizer: "whisper"     # "whisper"    → openai-whisper package (default, best offline)
                             # "sr_whisper" → SpeechRecognition wrapper around whisper
                             # NEVER "google" — that calls the internet
  countdown: true            # print remaining seconds while recording
  silence_threshold: 0.01    # RMS energy below this = silence (for record_until_silence)
  silence_max_seconds: 2.0   # stop after this many seconds of trailing silence
  confidence_min_chars: 10   # transcript length > this → confidence "high", else "low"


# ─────────────────────────────────────────────────────────────────────
# 6. SENTIMENT  ──  VADER-free lexicon scorer → compound float in [-1, 1]
#    (nltk is NOT in the install list — we roll our own)
#
#    enabled: true  → lexicon runs; compound score feeds into scale below
#    enabled: false → skip lexicon; scale asks llama3 for the score instead
# ─────────────────────────────────────────────────────────────────────
sentiment:
  enabled: true

  positive_words:     # word: weight  (each hit adds +weight to compound score)
                      # add domain-specific words here; remove irrelevant ones
    happy: 2.0
    good: 1.5
    great: 2.0
    better: 1.5
    calm: 1.5
    hopeful: 1.8
    relieved: 1.6
    thanks: 1.2
    love: 2.0
    excited: 1.8
    confident: 1.6
    # fine: 1.2
    # okay: 1.0
    # improving: 1.5

  negative_words:     # word: weight  (each hit adds -weight to compound score)
    sad: 2.0
    stressed: 2.0
    anxious: 2.2
    hopeless: 3.0
    depressed: 3.0
    overwhelmed: 2.5
    alone: 2.0
    lonely: 2.0
    afraid: 2.2
    tired: 1.5
    fail: 1.8
    failed: 1.8
    panic: 2.4
    cry: 2.0
    worried: 1.8
    # struggling: 1.8
    # stuck: 1.5
    # exhausted: 2.0

  boosters:           # word: multiplier  (scales the NEXT word's weight)
    very: 1.5
    really: 1.4
    completely: 1.7
    so: 1.3
    extremely: 1.8
    # absolutely: 1.6
    # incredibly: 1.7

  negations:          # these FLIP the sign of the next sentiment word
    - not
    - "no"            # MUST be quoted — bare `no` becomes boolean False in YAML
    - never
    - cannot
    - "can't"
    - "don't"
    - "didn't"
    # - barely
    # - hardly


# ─────────────────────────────────────────────────────────────────────
# 7. SCALE  ──  emotional / state tiers
#
#    enabled: true  → map sentiment score → named tier (using tiers table below)
#    enabled: false → skip; respond.py asks llama3 to name the state directly
#
#    TIER ROWS:  [name, low, high, emoji]
#      score falls in tier when  low <= score < high
#      remove a row to collapse that tier (score falls to next matching row)
#      add a row anywhere to insert a new tier
#
#    Quick examples:
#      3-tier: remove STRESSED and DISTRESSED rows
#      5-tier: remove DISTRESSED row
#      6-tier: keep all (default)
#
#    TIER BEHAVIOR (keyed by tier name):
#      alert.show    → print a console alert every time this tier is hit
#      alert.message → text displayed  ({turn} = turn number)
#      alert.color   → red | orange | yellow | green | blue
#      is_at_risk    → sets is_at_risk=True in the result dict
#    Tier risk weights → see scoring.tier_weights below (all in one place)
# ─────────────────────────────────────────────────────────────────────
scale:
  enabled: true

  tiers:
    - ["THRIVING",    0.60,  100.0, "🌟"]
    - ["CONTENT",     0.20,    0.60, "😊"]
    - ["NEUTRAL",    -0.19,    0.20, "😐"]
    - ["STRESSED",   -0.40,   -0.19, "😟"]  # remove this line → merges into NEUTRAL
    - ["DISTRESSED", -0.60,   -0.40, "😢"]  # remove this line → collapses into CRISIS
    - ["CRISIS",    -100.0,   -0.60, "🆘"]

  behavior:            # only tiers that need non-default behavior need a block here
    STRESSED:
      alert:
        show: false    # true → soft console warning every STRESSED turn
        message: "Turn {turn}: Student appears stressed."
        color: "orange"
      is_at_risk: false

    DISTRESSED:
      alert:
        show: true
        message: "⚠  Turn {turn}: Student is DISTRESSED. Consider a check-in."
        color: "orange"
      is_at_risk: false    # set true → DISTRESSED also flags at-risk

    CRISIS:
      alert:
        show: true
        message: "🚨 CRISIS — Turn {turn}: Immediate intervention needed. Counselling: 0800-XXX-XXXX"
        color: "red"
      is_at_risk: true     # CRISIS always flags at-risk


# ─────────────────────────────────────────────────────────────────────
# 8. CATEGORIES  ──  multi-label keyword classifier
#
#    enabled: true  → keyword matching runs on every turn
#    enabled: false → skip keywords; llama3 classifies category instead
#
#    PER-CATEGORY FIELDS:
#      escalation_target  → transitioning INTO this category = is_escalation=True
#      response_priority  → higher wins when multiple categories match (primary)
#      keywords           → case-insensitive word list; add / remove freely
#
#    TO DISABLE ONE CATEGORY: remove or comment out its block.
#    TO ADD A CATEGORY: add a block + add response rules for it below.
#
#    scoring_method:
#      "count"    → total keyword hits  (verbose messages score higher; default)
#      "presence" → binary 0/1 per category (one hit = detected)
# ─────────────────────────────────────────────────────────────────────
categories:
  enabled: true
  scoring_method: "count"

  ACADEMIC:
    escalation_target: false
    response_priority: 2
    keywords:          # add/remove words to tune detection for the exam theme
      [assignment, deadline, exam, grade, fail, pass, lecture, study,
       professor, submit, midterm, course, marks, test, quiz, tutor]
       # struggling, behind, attendance, plagiarism

  WELLBEING:
    escalation_target: true   # moving INTO WELLBEING = is_escalation=True
    response_priority: 5      # highest priority — dominates when matched
    keywords:
      [stress, anxious, depressed, lonely, overwhelmed, panic, cry,
       hopeless, afraid, sleep, sad, struggling, exhausted, burden,
       cope, coping, someone, talk, feelings, mental, upset, numb,
       empty, lost, broken, hurt, hard, difficult, tough, low, dark]
       # suicidal, harm, self-harm, breakdown, crisis, trauma

  FINANCIAL:
    escalation_target: false
    response_priority: 3
    keywords:
      [fees, scholarship, loan, afford, money, rent, bursary, payment,
       debt, overdue, broke, fund, grant, stipend, tuition]

  TECHNICAL:
    escalation_target: false
    response_priority: 1
    keywords:
      [portal, login, password, system, error, access, email, vpn, reset,
       laptop, broke, files, wifi, software, crash, website, account]

  SOCIAL:
    escalation_target: false
    response_priority: 2
    keywords:
      [friends, friend, roommate, belong, isolated, group, relationship,
       community, alone, bully, harassed, excluded, peer, social,
       connection, classmate, colleague, nobody, no one]

  ADMIN:
    escalation_target: false
    response_priority: 1
    keywords:
      [enrolment, certificate, transcript, registration, form, office,
       register, deadline, withdrawal, deferral, appeal, HR, document]

  # ── Catch-all GENERAL category ───────────────────────────────────
  # response_priority: 0 → only wins when NOTHING else matches.
  # Prevents "all_detected: []" on vague openers ("Hi, I need help").
  # The output looks like primary=GENERAL, all_detected=['GENERAL'] instead
  # of primary=GENERAL, all_detected=[] — visually cleaner in exam output.
  GENERAL:
    escalation_target: false
    response_priority: 0      # lowest possible — always loses to any specific category
    keywords:
      [help, please, need, support, okay, hi, hello, hey, issue,
       problem, situation, something, anything, wondering, question]

  # ── Template for a new domain category ──────────────────────────
  # MEDICAL:
  #   escalation_target: true
  #   response_priority: 4
  #   keywords:
  #     [hospital, doctor, prescription, sick, injury, medication]


# ─────────────────────────────────────────────────────────────────────
# 9. INTENTS  ──  single-label keyword intent (used by classify_intent)
#    Separate from categories — these are conversational acts, not support domains.
#    Add / remove rows freely.
# ─────────────────────────────────────────────────────────────────────
intents:
  greeting:  [hi, hello, hey, "good morning", "good afternoon", "good evening"]
  goodbye:   [bye, goodbye, "see you", "thank you", thanks, done, finished]
  question:  ["?", how, what, why, when, where, who, explain, tell, clarify]
  complaint: [angry, terrible, worst, unacceptable, broken, awful, useless, ridiculous]
  request:   [please, "can you", "could you", "i need", "i want", help, assist, support]
  # praise:  [great, perfect, love, excellent, helpful, amazing]


# ─────────────────────────────────────────────────────────────────────
# 10. RESPONSES  ──  rule table + LLM fallback
#
#    enabled: true  → rule table is consulted before the LLM
#    enabled: false → skip rules; every response comes from llama3
#
#    RULE KEY FORMATS (checked in this priority order):
#      "CATEGORY|TIER"   exact match        → "WELLBEING|CRISIS"
#      "CATEGORY|*"      wildcard tier      → "FINANCIAL|*"
#      "CATEGORY"        category only      → "WELLBEING"
#      "*"               last-resort catch-all (use sparingly — blocks LLM)
#    No match + use_llm_fallback=true  → llama3 responds
#    No match + use_llm_fallback=false → default string
# ─────────────────────────────────────────────────────────────────────
responses:
  enabled: true
  use_llm_fallback: true   # true  = LLM responds when no rule matches (recommended)
                            # false = default string when no rule matches
  default: "Thank you for sharing that. Can you tell me a little more?"

  rules:
    # ── exact CATEGORY|TIER (most specific — checked first) ──────
    "WELLBEING|CRISIS":     "I am very concerned about you. Please contact the counselling line RIGHT NOW: 0800-XXX-XXXX."
    "WELLBEING|DISTRESSED": "It sounds like you are going through a really difficult time. Have you spoken to anyone about how you are feeling?"
    "WELLBEING|STRESSED":   "Things seem to be piling up. Let us slow down — what is weighing on you most right now?"
    "ACADEMIC|DISTRESSED":  "Falling behind can feel overwhelming. Your faculty academic support office can help — shall we find their contact?"
    "ACADEMIC|STRESSED":    "Exam pressure is real. Have you spoken to your tutor about what support your faculty offers?"
    "SOCIAL|CRISIS":        "Feeling completely alone is serious. Please reach out to the counselling service today: 0800-XXX-XXXX."
    "SOCIAL|DISTRESSED":    "Feeling isolated is incredibly hard. The student union runs weekly social events — would that help?"

    # ── wildcard tier (category + any tier) ──────────────────────
    "FINANCIAL|*":  "Financial difficulty is more common than you think. The bursary office can help — shall I give you their contact?"
    "TECHNICAL|*":  "Let me help with that technical issue. Which system are you trying to access?"
    "ADMIN|*":      "I can help with that admin question. Which office or form do you need?"

    # ── category only (no tier needed — works when scale is off) ──
    "WELLBEING":    "It sounds like a tough time. Would you like to talk more about how you are feeling?"
    "ACADEMIC":     "Let us look at what academic support is available. Have you checked with your faculty office?"
    "SOCIAL":       "Social connections really matter. Have you tried any of the student society events?"
    "FINANCIAL":    "Financial worries can be really stressful. Have you contacted the bursary office?"

    # ── add more rules below as the exam demands ──────────────────
    # "MEDICAL|*":  "Your health comes first. Have you spoken to the campus health centre?"
    # "*":          "I hear you. Can you tell me a bit more?"  # catch-all (use sparingly)


# ─────────────────────────────────────────────────────────────────────
# 11. SCORING  ──  risk formula  (all weights in one place)
#
#    enabled: true  → formula computes a 0-100 risk score
#    enabled: false → llama3 estimates risk from the full conversation
#
#    FORMULA:
#      risk = base_risk
#           + abs(avg_sentiment_score) × wellbeing_weight
#           + sum(tier_weights[tier] for each turn)
#           + escalation_count × escalation_weight
#           + verbose_bonus  (if avg words/turn > verbose_threshold)
#      clamped to [0, 100]
#      action = first threshold the score meets (checked high → low)
# ─────────────────────────────────────────────────────────────────────
scoring:
  enabled: true
  base_risk: 20                # starting point before any penalties
  wellbeing_weight: 40         # × abs(session-average sentiment score)
  escalation_weight: 10        # × number of category escalation transitions
  verbose_threshold: 20        # if avg words/turn exceeds this → add verbose_bonus
  verbose_bonus: 5

  tier_weights:                # risk points added PER TURN at that tier
    THRIVING: 0                # set negative (e.g. -5) to reward positive turns
    CONTENT: 0
    NEUTRAL: 0
    STRESSED: 5                # remove a tier or set 0 → that tier contributes nothing
    DISTRESSED: 10
    CRISIS: 15

  thresholds:                  # action assigned to the highest threshold the score clears
    URGENT_REFERRAL: 70        # risk ≥ 70 → URGENT_REFERRAL
    FOLLOW_UP: 40              # risk ≥ 40 → FOLLOW_UP
    NO_ACTION: 0               # risk ≥ 0  → NO_ACTION  (always matches last)
    # MONITOR: 25              # add intermediate thresholds as needed


# ─────────────────────────────────────────────────────────────────────
# 12. TRAJECTORY  ──  did the student improve or decline?
#
#    method: "halves" (default, matches NEXUS exam algorithm)
#      split session into first-half / second-half, compare averages
#    method: "slope"
#      fit a line through all sentiment scores; sign of slope = trend
#
#    A trend is "improving"   if second_avg > first_avg + improving_threshold
#              "declining"   if second_avg < first_avg - declining_threshold
#              "fluctuating" otherwise
# ─────────────────────────────────────────────────────────────────────
trajectory:
  method: "halves"
  improving_threshold: 0.10   # second half must beat first half by this much
  declining_threshold: 0.10   # first half must beat second half by this much


# ─────────────────────────────────────────────────────────────────────
# 13. SESSION  ──  live session controls
# ─────────────────────────────────────────────────────────────────────
session:
  max_turns: 10          # stop after this many turns  (0 = unlimited)
  auto_report: true      # print the full report automatically when session ends
  input_modes:           # set false to hide that tab in the gradio UI
    text: true
    voice: true
    vision: false        # flip to true when the exam adds a vision requirement


# ─────────────────────────────────────────────────────────────────────
# 14. REPLAY  ──  offline log replay  (the exam "surprise stage")
#
#    On exam day: paste the exam's STUDENT_LOG into `log` below.
#    Run: python -c "from pipeline.replay import run_replay_from_config; run_replay_from_config()"
#    Or click "Run Replay" in the gradio Report tab.
# ─────────────────────────────────────────────────────────────────────
replay:
  enabled: true
  print_per_turn: true   # print tier + category + response after each entry
  print_report: true     # print the full session report at the end
  log:                   # ← REPLACE with the exam's STUDENT_LOG on exam day
    - "Hi, I need some help please."
    - "I have a major assignment due tomorrow and I have not started."
    - "My laptop also broke yesterday so I cannot access my files."
    - "To be honest I have been struggling a lot lately, not just academically."
    - "I have not been sleeping, I feel completely hopeless about everything."
    - "I think I might need to talk to someone but I do not know who."
    - "Also I got an email saying my fees are overdue and I cannot register."
    - "Sorry for dumping all this. I just feel very alone right now."
    - "Actually, my friend just texted. I feel a tiny bit better now."
    - "Thank you for listening. I will try to contact the counsellor."


# ─────────────────────────────────────────────────────────────────────
# 15. REPORT  ──  session intelligence report
# ─────────────────────────────────────────────────────────────────────
report:
  use_llm_narrative: true   # true  = llama3 writes the clinical narrative section
                             # false = deterministic fallback narrative only

  sections:                  # set any section to false to hide it from the report
    session_summary: true        # total turns, voice vs text breakdown
    wellbeing_trajectory: true   # trend + lowest tier
    support_categories: true     # categories ranked by frequency
    escalations: true            # transitions into escalation_target categories
    risk_score: true             # numeric score + recommended action
    llm_narrative: true          # prose narrative written by llama3
    vision_summary: true         # gesture/mood/blink summary (if vision was active)
    include_raw_turns: false     # true = print the full turn-by-turn log

  llm_narrative_prompt: |
    You are writing a {audience} report.
    Risk score: {risk_score}/100  →  Recommended action: {action}
    Session summary: {tier_summary}

    Full conversation:
    {conversation}

    Write a concise clinical narrative (3-5 sentences) covering:
    - the student's emotional arc across the session
    - the main support needs identified
    - any critical moments (crisis alerts, escalations)
    - a clear recommended next step for the support team.
    Do NOT repeat the raw numbers — interpret them in plain language.

  narrative_audience: "university counselling team"
  banner_title: "SESSION INTELLIGENCE REPORT"    # change to match exam theme
  banner_subtitle: "Counsellor Eyes Only"
  banner_width: 55


# ─────────────────────────────────────────────────────────────────────
# 16. VISION  ──  OpenCV only (Haar cascades ship inside opencv-python)
#    All detectors have `enabled: true/false`.
#    Setting enabled: false removes that detector from the live loop.
# ─────────────────────────────────────────────────────────────────────
vision:
  webcam_index: 0         # 0 = default webcam; try 1 or 2 if wrong camera opens
  flip_webcam: true       # true = mirror selfie view (natural feel)
  wait_key_ms: 1          # cv2.waitKey delay ms in the live loop (1 = responsive)

  # ── Backend selection ────────────────────────────────────────────
  # "auto"       → mediapipe (if installed) > dnn/yunet > lbp/opencv
  # "mediapipe"  → force MediaPipe (must be installed: pip install mediapipe)
  # "dnn"        → force YuNet + FER DNN models (models/ folder must exist)
  # "opencv"     → force LBP cascades (always available, no downloads)
  backend: "mediapipe"

  # ── Performance: frame-skip + downscale ─────────────────────────
  # Run full detection every N frames; reuse the result in between.
  # 1 = detect every frame (slowest, max accuracy)
  # 3 = detect every 3rd frame (recommended, ~3× FPS boost)
  detect_every_n: 3

  # Scale frame DOWN to this fraction for detection, then scale results back.
  # 0.5 = half resolution detection (2× faster, minimal accuracy loss)
  # 1.0 = full resolution (no downscale)
  detect_scale: 0.5

  # ── MediaPipe settings (reference guide section 1) ──────────────
  # All 0.7 per reference: prevents false positives + reduces jitter
  mediapipe:
    max_faces: 2
    max_hands: 2
    min_detection_confidence: 0.7   # 0.7 confident → prevents false positives in poor lighting
    min_tracking_confidence:  0.7   # 0.7 confident → reduces landmark jitter

  # ── YuNet DNN face detector ──────────────────────────────────────
  yunet:
    confidence: 0.6

  # ── Blink / drowsiness thresholds (reference guide section 2) ───
  blink:
    enabled: true
    eyes_closed_frames: 2          # cascade path: consecutive no-eye frames = closed
    ear_closed_threshold: 0.25     # MediaPipe EAR < 0.25 → eye closed  (reference: confident)
                                   # ear >= 0.25 → open / blink end
  
  # ── Drowsiness alert ────────────────────────────────────────────
  drowsy:
    enabled: true
    closed_frames_alert: 20        # EAR < 0.25 for 20 frames → "Drowsy"  (~0.6s @ 30fps)
    awake_recovery_frames: 5       # EAR >= 0.25 for 5 frames before drowsy resets
                                   # prevents micro-opens from resetting the alert instantly
    alert_message: "DROWSY! Wake up!"

  # ── Lip reading / vowel classification (reference guide section 3)
  # classifier: "simple" (fast threshold logic) | "fuzzy" (Gaussian profiles, highest accuracy)
  lip:
    enabled: true              # false = skip lip/vowel detection entirely
    classifier: "fuzzy"            # "simple" or "fuzzy"
    mar_threshold_a: 0.50          # A:  MAR > 0.50  (jaw dropped fully)
    mar_threshold_e: 0.22          # E:  MAR > 0.22 AND width > 0.42
    mar_threshold_i: 0.22          # I:  MAR < 0.22 AND width > 0.42
    width_ratio_wide: 0.42         # E/I: lips stretched wide horizontally
    width_ratio_round: 0.38        # O/U: lips puckered (width < 0.38)
    smile_width_threshold: 0.35    # corner_lift > 0.35 → smiling
    confidence_floor: 0.42         # below this fuzzy confidence → output "?"

  # ── Temporal smoothing (reference guide section 6) ───────────────
  smoothing:
    ema_alpha: 0.35                # EMA alpha: moderate smoothing for EAR / MAR values
    gesture_history: 12            # majority-vote window for gesture stabilisation
    vowel_history: 12              # majority-vote window for vowel stabilisation
    kalman_process_noise: 0.001    # Q = 1e-3 (allows smooth continuous movement)
    kalman_measure_noise: 0.1      # R = 1e-1 (trusts MP measurement but damps micro-jitter)

  # ── Haar cascade filenames ──────────────────────────────────────
  # These XML files ship inside opencv-python (offline, no download needed).
  # Verify location: python -c "import cv2,os; print(os.listdir(cv2.data.haarcascades))"
  haar:
    face:  "haarcascade_frontalface_default.xml"
    eye:   "haarcascade_eye.xml"
    smile: "haarcascade_smile.xml"
    face_scale:      1.1   # detectMultiScale scaleFactor (1.05 = more detections, slower)
    face_neighbors:  5     # minNeighbors  (↑ = fewer false positives, ↓ = more detections)
    eye_neighbors:   8
    smile_neighbors: 20    # smile over-fires below ~15

  # ── Face detect (master switch — disabling this disables blink/smile/head too) ──
  face_detect:
    enabled: true

  # ── Head-pose zone (Left / Right / Up / Down / Forward) ─────────
  head_pose:
    enabled: true
    deadzone_ratio: 0.15   # fraction of frame treated as "Forward" (bbox-based fallback)

  head_zones:
    # Landmark-based Up/Down thresholds (MediaPipe path).
    # Measure = (nose_y - eye_mid_y) / face_height
    # In a neutral forward pose this ratio is ~0.28-0.35.
    # Decrease up_ratio to require more tilt before "Up" fires.
    # Increase down_ratio to require more tilt before "Down" fires.
    up_ratio:   0.20   # ratio < this → "Up"   (nose close to eyes)
    down_ratio: 0.42   # ratio > this → "Down" (nose far below eyes)

  # ── Smile-mood (Smiling / Neutral) ──────────────────────────────
  smile_mood:
    enabled: true

  # ── Hand gesture (reference guide section 4) ───────────────────
  # MediaPipe path: 21 landmarks, thumb handedness-aware, special gestures
  # OpenCV path:   skin-mask + convex hull (fallback, lighting-sensitive)
  gesture:
    enabled: true
    hold_seconds: 1.0         # gesture must be held this long to commit  (reference: 1.0s)
    high_five_y_ratio: 1.6    # High Five: wrist.y < screen_height / 1.6  (hand raised high)
    skin_ycrcb:               # YCrCb skin mask (OpenCV fallback path only)
      lower: [0, 133, 77]
      upper: [255, 173, 127]
    min_contour_area: 5000
    gesture_map:              # finger count → [name, emoji]  (add rows freely)
      "0": ["Fist",      "✊"]
      "1": ["One",       "☝️"]
      "2": ["Peace",     "✌️"]
      "3": ["Three",     "3️⃣"]
      "4": ["Four",      "4️⃣"]
      "5": ["Open Hand", "🖐"]
      # Special gestures (detected by geometry, not just count):
      # "Thumbs Up" → fingers==1 AND thumb_tip.y < thumb_ip.y AND index_tip.y > index_pip.y
      # "High Five"  → fingers==5 AND wrist.y < screen_height / 1.6

  # ── Colour tracker ──────────────────────────────────────────────
  color_track:
    enabled: false              # flip to true when the exam asks for colour tracking
    active_color: "red"         # which preset to track
    presets:                    # add new colours with HSV [H, S, V] lower/upper bounds
      red:   {lower: [0,   120,  70], upper: [10,  255, 255]}
      green: {lower: [40,   70,  70], upper: [80,  255, 255]}
      blue:  {lower: [100, 150,   0], upper: [140, 255, 255]}
      # yellow: {lower: [20, 100, 100], upper: [35, 255, 255]}
      # orange: {lower: [10, 120,  70], upper: [25, 255, 255]}

  # ── Motion detector ─────────────────────────────────────────────
  motion:
    enabled: false              # flip to true for activity / "wave to continue" tasks
    method: "diff"              # "diff" = frame-difference (simple, fast)
                                # "mog2" = background subtractor (better for static bg)
    threshold: 25               # pixel-difference value to count as motion (for "diff")
    min_area: 500               # ignore motion blobs smaller than this (px²)

  # ── HUD (what is drawn on the frame) ────────────────────────────
  # The LAYOUT LISTS control BOTH what is shown AND where it appears.
  # To hide an element: remove it from every layout list.
  # To move an element: move it to a different corner list.
  # To add a new element: add a string key and handle it in vision/bridge.py.
  #
  # All available elements:
  #   fps        → frames-per-second counter
  #   tier       → current wellbeing tier name + emoji
  #   score      → current sentiment compound score
  #   turn       → current session turn number
  #   blink      → running blink count
  #   drowsy     → drowsiness status / alert
  #   head_zone  → head position (Left / Right / Up / Down / Center)
  #   gesture    → detected hand gesture name + emoji
  #   mood       → smile-mood (Smiling / Neutral)
  hud:
    font_scale: 0.7              # text size on frame (0.5 = small, 1.0 = large)
    thickness: 2                 # stroke thickness in pixels
    color_default: [0, 255, 0]   # BGR — green  (normal info labels)
    color_warning: [0, 0, 255]   # BGR — red    (alerts: drowsy, crisis tier)
    color_info:    [255, 255, 0] # BGR — cyan   (secondary labels)
    layout:                      # add/remove/move items to customise the overlay
      top_left:     ["blink", "drowsy", "head_zone"]   # remove item → hide it
      top_right:    ["fps", "tier", "score"]            # add "turn" → show turn counter here
      bottom_left:  ["gesture"]                          # add "mood" → show mood here
      bottom_right: ["mood", "turn"]                    # remove "turn" → hide turn counter

  # ── Display / web stream ────────────────────────────────────────
  # Annotated frames (with all HUD overlays drawn) are streamed to the
  # gradio Vision tab as a live video feed.
  display:
    width: 640
    height: 480
    stream_fps: 15               # target frames per second to the browser
    show_window: false           # true = ALSO open a cv2.imshow() window (debug only)

  # ── Stability (reduce flicker) ──────────────────────────────────
  stability:
    gesture_hold_frames: 5       # gesture must be stable for N frames before it locks in
    blink_debounce_frames: 3     # ignore re-trigger within N frames of a blink
    mood_history_frames: 15      # majority-vote mood over last N frames

  # ── Vision → LLM bridge ─────────────────────────────────────────
  bridge:
    include_in_llm_context: true   # pass vision labels to llama3 as context each turn
    context_template: "[Vision] Face: {face_present}, Mood: {mood}, Gesture: {gesture}, Head: {head_zone}"


# ─────────────────────────────────────────────────────────────────────
# 17. UI  ──  gradio app
# ─────────────────────────────────────────────────────────────────────
ui:
  app_title: "Multimodal HCI Assistant"
  app_subtitle: "Text + Voice + Vision  |  llama3 (Ollama) + Whisper + OpenCV"
  server_port: 7860
  share: false   # true = create a public gradio.live link (needs internet — exam-day: false)


# ─────────────────────────────────────────────────────────────────────
# 18. PIPELINE — global stage definitions
#
#  Each entry defines ONE stage capability.
#  Tab contexts (section 19) reference stages by name and override fields.
#
#  Stage schema:
#    name       unique identifier — referenced in pipeline_order and depends_on
#    type       maps to an executor function in pipeline/stages.py
#    enabled    default enabled state (overridden per-tab)
#    method     which backend runs (overridden per-tab)
#    fallback:
#      on       when to trigger: "failure" | "disabled" | "empty" | "no_match"
#      method   try this backend next
#      value    inject this literal value if all methods fail (null = _skipped marker)
#    config     stage-specific extra config (not inherited)
#
#  NOTE: "enabled: false" does NOT skip the stage silently.
#        The executor writes the fallback value WITH _skipped: true
#        so dependent stages can detect and adjust. See executor.py.
# ─────────────────────────────────────────────────────────────────────
stages:

  # ── INPUT STAGES ──────────────────────────────────────────────────

  - name: stt
    type: voice_input
    enabled: true
    method: whisper             # whisper | sr_whisper
    fallback:
      on: failure
      value: {text: "", language: "?", confidence: "low"}
                                # empty transcript — pipeline continues without crashing

  - name: text_input
    type: text_input
    enabled: true
    method: direct
    fallback:
      on: empty
      value: {text: ""}

  - name: vision_input
    type: vision_input
    enabled: true              # off by default; vision + multimodal tabs override
    method: bridge
    fallback:
      on: failure
      value: {present: false, mood: "no_face", gesture: "none", head_zone: null}

  # ── FUSER ─────────────────────────────────────────────────────────
  # Resolves multiple active inputs into one text payload.
  # In single-input tabs this is a transparent pass-through.

  - name: fuser
    type: fuser
    enabled: true
    method: auto_priority
    fallback:
      on: no_input
      method: silent            # produce empty payload; no crash
    config:
      priority: [voice, text, vision]  # first source with content wins
      no_input_behavior: warn          # warn | hide_tab | error_message | disable_send

  # ── CONTEXT INJECTOR ──────────────────────────────────────────────
  # Attaches camera data to the turn before analysis runs.

  - name: context_inject
    type: context_injector
    # SELF-DISABLING BEHAVIOUR:
    # The stage reads LIVE.vision.snapshot(). If the camera is not running
    # or the last frame is stale (> 2s old), it returns {injected: false}
    # and the pipeline continues unchanged — no vision context is added.
    # When the camera IS running, vision labels are prepended to the LLM
    # prompt so llama3 "sees" what the webcam detects:
    #   "[Vision] Face: True, Mood: happy, Gesture: Peace, Head: Forward"
    # This is the ONLY way vision reaches llama3 (which is text-only).
    enabled: true
    method: context             # context  → append label string to LLM prompt
                                # score    → add vision signals to sentiment compound score
                                # primary  → vision IS the text (camera-only mode)
                                # annotate → log only, invisible to LLM
    fallback:
      on: failure
      value: {injected: false}
    config:
      score_weights:            # used when method: score
        # Keys must match the exact mood strings returned by mood_of():
        # happy, neutral, sad, angry, surprised, sleepy, no_face
        # and gesture strings from classify_gesture(): Peace, Fist, etc.
        happy:          0.30
        neutral:        0.00
        surprised:      0.10
        sad:           -0.25
        angry:         -0.30
        sleepy:        -0.20
        no_face:       -0.10
        # gesture-based modifiers:
        "Thumbs Up":    0.20
        "Fist":        -0.15

  # ── ANALYSIS STAGES ───────────────────────────────────────────────
  # INTERDEPENDENCY: sentiment → scale (score flows down)
  #                 classify  → trajectory (support_log flows down)
  # If a stage is disabled its _skipped=True marker travels to dependents.

  - name: sentiment
    type: analyzer
    enabled: true
    method: lexicon             # lexicon | llm | hybrid
    fallback:
      on: failure
      method: llm               # if lexicon crashes → LLM scores
      value: {compound: 0.0, pos: 0.0, neg: 0.0, neu: 1.0}

  - name: scale
    type: tier_mapper
    enabled: true
    method: formula
    fallback:
      on: failure
      method: llm               # if formula fails → LLM names the tier
      value: {tier: "NEUTRAL", score: 0.0, emoji: "😐", is_at_risk: false}
                                # if sentiment was _skipped → scale uses LLM automatically

  - name: classify
    type: classifier
    enabled: true
    method: keyword             # keyword | llm | keyword_then_llm
    fallback:
      on: no_match
      method: llm               # no keyword hits → let LLM classify
      value: {primary: "GENERAL", all_detected: [], scores: {}}

  - name: trajectory
    type: tracker
    enabled: true
    method: halves
    fallback:
      on: insufficient_data     # fewer than 2 turns in session
      value: {trend: "unknown", lowest_tier: null, at_risk_turns: []}
                                # if classify was _skipped → transition detection skipped automatically

  # ── RESPONDER ─────────────────────────────────────────────────────

  - name: respond
    type: responder
    enabled: true
    method: rule_then_llm       # rule_only | llm_only | rule_then_llm
    fallback:
      on: all_fail
      value: "{responses.default}"
                                # if scale _skipped → tier="UNKNOWN" → rule misses → LLM runs
                                # if classify _skipped → category="GENERAL" → same path

  # ── OUTPUT STAGES ─────────────────────────────────────────────────

  - name: display
    type: output_display
    enabled: true
    method: stream              # stream | text
    fallback:
      on: failure
      method: text              # fallback to non-streaming if stream breaks

  - name: tts
    type: output_tts
    enabled: true              # off globally; voice + multimodal tabs can override
    method: system              # system (macOS: say / Linux: espeak) | silent
    fallback:
      on: failure
      method: silent            # TTS failure → log + continue, never crash
    config:
      rate: 150                 # words per minute
      blocking: false           # false = speak in background, UI stays responsive

  # ── ALWAYS-LAST ───────────────────────────────────────────────────

  - name: log
    type: logger
    enabled: true               # NEVER set false — session history integrity
    method: session
    fallback:
      on: failure
      method: silent            # log failure → warn only, never abort the turn


# ─────────────────────────────────────────────────────────────────────
# 19. TABS — pipeline context per tab
#
#  Each tab defines:
#    enabled          whether the tab appears in the UI
#    label            the tab's display name
#    pipeline_order   ordered list of stage names to execute
#    overrides        field-level overrides on top of global stage defaults
#
#  Override granularity: any field in the stage schema can be overridden.
#  Example — override just the method:
#    overrides:
#      sentiment: {method: llm}
#  Example — override enabled + config:
#    overrides:
#      tts: {enabled: true, config: {rate: 120}}
#
#  Tab validation at startup (executor.validate_tabs()):
#    If no input stage is enabled in a tab's pipeline_order,
#    the fuser's no_input_behavior determines what happens.
# ─────────────────────────────────────────────────────────────────────
tabs:

  # ── 💬 CHAT TAB ───────────────────────────────────────────────────
  # Text in. Display out. TTS off by default (flip tts.enabled to true).
  chat:
    enabled: true
    label: "💬 Chat"
    pipeline_order:
      - text_input
      - fuser
      - context_inject    # no-op when vision_input disabled
      - sentiment
      - scale
      - classify
      - trajectory
      - respond
      - display
      - tts
      - log
    overrides:
      stt:             {enabled: false}
      vision_input:    {enabled: false}
      context_inject:  {enabled: true}   # vision labels → LLM prompt; no-op when camera is off
      tts:             {enabled: false}  # set true to speak chat responses aloud

  # ── 🎙️ VOICE TAB ──────────────────────────────────────────────────
  # Mic in → STT → pipeline. TTS on (speaks the response back).
  # Disable tts here if you only want to hear yourself, not the reply.
  voice:
    enabled: true
    label: "🎙️ Voice"
    pipeline_order:
      - stt
      - fuser
      - context_inject
      - sentiment
      - scale
      - classify
      - trajectory
      - respond
      - display
      - tts
      - log
    overrides:
      text_input:      {enabled: false}
      vision_input:    {enabled: false}
      context_inject:  {enabled: true}   # vision labels → LLM prompt; no-op when camera is off
      tts:             {enabled: true}   # voice tab speaks responses

  # ── 📷 VISION TAB ─────────────────────────────────────────────────
  # Camera is the input. Vision context string becomes the text.
  # No audio. No TTS (visual-only feedback).
  vision:
    enabled: true
    label: "📷 Vision"
    pipeline_order:
      - vision_input
      - fuser
      - context_inject    # primary mode: vision IS the text
      - sentiment
      - scale
      - classify
      - trajectory
      - respond
      - display
      - log
    overrides:
      stt:          {enabled: false}
      text_input:   {enabled: false}
      vision_input: {enabled: true}
      context_inject:
        enabled: true
        method: primary   # vision replaces text
      tts:          {enabled: false}

  # ── 🎭 MULTIMODAL TAB ─────────────────────────────────────────────
  # Full pipeline. All sources can be active simultaneously.
  # The fuser decides which wins based on priority and what arrived.
  #
  # DEFAULT: voice + camera, text off, vision context mode.
  # SWITCH TO text+camera: set text_input.enabled: true, stt.enabled: false
  # SWITCH TO voice only:  set vision_input.enabled: false
  # SWITCH TO camera only: set stt.enabled: false, text_input.enabled: false
  #   (fuser auto-routes to vision via priority list)
  #
  # WHAT IF ALL INPUTS FALSE:
  #   fuser sees no_input → triggers no_input_behavior (warn / hide_tab)
  #   Tab is validated at startup — warning printed if this happens.
  multimodal:
    enabled: true            # flip to true when exam requires combined modalities
    label: "🎭 Multimodal"
    pipeline_order:
      - stt
      - text_input
      - vision_input
      - fuser
      - context_inject
      - sentiment
      - scale
      - classify
      - trajectory
      - respond
      - display
      - tts
      - log
    overrides:
      stt:
        enabled: true
      text_input:
        enabled: true        # flip to true for text+voice in same tab
      vision_input:
        enabled: true
      fuser:
        enabled: true
        method: auto_priority
        config:
          priority: [voice, text, vision]
          no_input_behavior: warn
      context_inject:
        enabled: true
        method: context       # vision appended to LLM prompt (not primary)
      tts:
        enabled: true        # flip to true to speak multimodal responses

  # ── 📋 REPORT TAB ─────────────────────────────────────────────────
  # No pipeline — reads from session state directly.
  report:
    enabled: true
    label: "📋 Report"
    pipeline_order: []        # empty = no stages, display-only tab
